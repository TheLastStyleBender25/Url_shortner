name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  auth-service-tests:
    name: Auth Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: services/auth-service
        env:
          DB_PORT: "5432"
          DB_USER: "test"
          DB_NAME: "test"
          DB_PASSWORD: "test"
          DB_HOST: "localhost"
          JWT_SECRET_KEY: "test-secret-key"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          RESEND_API_KEY: "test-key"
          EMAIL_FROM: "test@example.com"
        run: |
          pytest -v


  url-service-tests:
    name: URL Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/url-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: services/url-service
        env:
          DB_PORT: "5432"
          DB_USER: "test"
          DB_NAME: "test"
          DB_PASSWORD: "test"
          DB_HOST: "localhost"
          JWT_SECRET_KEY: "test-secret-key"
          JWT_ALGORITHM: "HS256"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
        run: |
          pytest -v


  api-gateway-tests:
    name: API Gateway Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: services/api-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: services/api-gateway
        env:
          AUTH_SERVICE_URL: "http://auth-service-URL:8000"
          URL_SERVICE_URL: "http://url-service-URL:8000"
        run: |
          pytest -v


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Service
        run: |
          docker build \
            -t auth-service \
            ./services/auth-service

      - name: Build URL Service
        run: |
          docker build \
            -t url-service \
            ./services/url-service

      - name: Build API Gateway
        run: |
          docker build \
            -t api-gateway \
            ./services/api-gateway